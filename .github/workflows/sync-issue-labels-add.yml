name: Add Linked Issue Labels to PR

on:
  workflow_run:
    workflows: ["Compute Linked Issue Labels"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  pull-requests: write
  issues: write

jobs:
  add-labels:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download labels artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read labels payload
        id: read
        run: |
          labels_file=$(find artifacts -name labels.json | head -n 1)
          if [ -z "$labels_file" ]; then
            echo "No labels.json artifact found. Falling back to no-op outputs."
            echo "labels=[]" >> "$GITHUB_OUTPUT"
            echo "labels_count=0" >> "$GITHUB_OUTPUT"
            echo "pr_number=0" >> "$GITHUB_OUTPUT"
            echo "is_fork_pr=true" >> "$GITHUB_OUTPUT"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          labels=$(jq -c '.labels // []' "$labels_file")
          pr_number=$(jq -r '.pr_number // 0' "$labels_file")
          is_fork_pr=$(jq -r '.is_fork_pr // false' "$labels_file")
          dry_run=$(jq -r '.dry_run // false' "$labels_file")
          labels_count=$(echo "$labels" | jq 'length')
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "labels_count=$labels_count" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "is_fork_pr=$is_fork_pr" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

      - name: Add labels to PR
        if: ${{ steps.read.outputs.is_fork_pr != 'true' && steps.read.outputs.dry_run != 'true' && steps.read.outputs.pr_number != '0' && steps.read.outputs.labels_count != '0' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = Number('${{ steps.read.outputs.pr_number }}');
            const labels = ${{ steps.read.outputs.labels }};
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              labels,
            });
            console.log(`Added ${labels.length} labels to PR #${prNumber}.`);

      - name: No-op summary
        if: ${{ steps.read.outputs.is_fork_pr == 'true' || steps.read.outputs.dry_run == 'true' || steps.read.outputs.pr_number == '0' || steps.read.outputs.labels_count == '0' }}
        run: |
          echo "Skipping label write."
          echo "is_fork_pr=${{ steps.read.outputs.is_fork_pr }}"
          echo "dry_run=${{ steps.read.outputs.dry_run }}"
          echo "pr_number=${{ steps.read.outputs.pr_number }}"
          echo "labels_count=${{ steps.read.outputs.labels_count }}"
